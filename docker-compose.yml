name: recruitment
x-backend: &backend
  image: recruitment-backend:test
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql://recruitment:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/recruitment
    REDIS_URL: redis://redis:6379/0
    GOOGLE_TOKEN_FILE: /run/secrets/google-token.json
  volumes:
    - ${GOOGLE_SECRETS_DIR:-./secrets}:/run/secrets:ro
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recruitment
      POSTGRES_DB: recruitment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [recruitment_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment -d recruitment"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *backend
    depends_on:
      postgres: {condition: service_healthy}
    command: alembic -c backend/alembic.ini upgrade head
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
  heavy:
    <<: *backend
    command: celery -A backend.workers.pipeline:app worker -Q heavy --concurrency=1 -l INFO
  light:
    <<: *backend
    command: celery -A backend.workers.pipeline:app worker -Q light --concurrency=2 -l INFO
  beat:
    <<: *backend
    command: celery -A backend.workers.pipeline:app beat -s /tmp/recruitment-beat -l INFO
  frontend:
    image: recruitment-frontend:test
    build: ./frontend
    depends_on: [api]
    ports: ["3000:8080"]
volumes:
  recruitment_data:
