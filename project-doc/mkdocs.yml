site_name: Autonomous Recruitment Agent
site_description: Technical documentation for the Autonomous Recruitment Agent platform
site_url: http://localhost:8001
repo_name: Vinilnaik3705/Autonomous_Recruitment_Agent
repo_url: https://github.com/Vinilnaik3705/Autonomous_Recruitment_Agent

theme:
  name: material
  features:
